# Config de Codex del frontend MiBeca.
#
# Se combina con la config global de Codex. Este archivo solo fija lo propio del
# frontend: el MCP de Playwright para revision visual y de accesibilidad, con el
# mismo pin que usa OpenCode (opencode.json de este repo).
#
# Pin explicito: sin el, npx instala la ultima publicada a mitad de proyecto y el
# catalogo de tools puede cambiar entre sesiones. Subir a proposito.

[mcp_servers.playwright]
command = "C:/Program Files/nodejs/npx.cmd"
args = ["-y", "@playwright/mcp@0.0.83"]
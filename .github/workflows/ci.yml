name: Frontend CI

on:
  pull_request:
  push:
    branches: [main, dev, sergio]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node .codex/hooks/audit_bridge.mjs --all
      - run: npm run lint
      - run: npm test
      - run: npm run build
